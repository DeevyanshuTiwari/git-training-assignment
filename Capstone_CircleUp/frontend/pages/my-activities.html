<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Activities - CircleUp</title>

    <!-- CSS Imports -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
    <link rel="stylesheet" href="../assets/css/my-activities.css">

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="dashboard-body">

<!-- Sidebar Navigation -->
<aside class="sidebar glass-panel">
    <div class="sidebar-brand">
        <i class="ph ph-circles-three-plus"></i>
        <h2>CircleUp</h2>
    </div>

    <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item">
            <i class="ph ph-squares-four"></i> Dashboard
        </a>
        <a href="browse.html" class="nav-item">
            <i class="ph ph-compass"></i> Browse Activities
        </a>
        <a href="my-activities.html" class="nav-item active">
            <i class="ph ph-calendar-check"></i> My Activities
        </a>
        <a href="create-activity.html" class="nav-item">
            <i class="ph ph-plus-circle"></i> Create Activity
        </a>
        <a href="profile.html" class="nav-item">
            <i class="ph ph-user"></i> Profile
        </a>
    </nav>

    <div class="sidebar-footer">
        <button id="btn-logout" class="btn btn-outline btn-full">
            <i class="ph ph-sign-out"></i> Logout
        </button>
    </div>
</aside>

<!-- Main Content Area -->
<main class="dashboard-main">
    <!-- My Activities Content -->
    <div class="dashboard-content">
        <div class="section-header">
            <h2>My Activities</h2>
            <p>Manage your hosted events and activities you've joined.</p>
        </div>

        <!-- Tabs -->
        <div class="tabs-container">
            <div class="tabs">
                <button class="tab-btn active" data-tab="tab-hosting">Hosting</button>
                <button class="tab-btn" data-tab="tab-joined">Joined</button>
                <button class="tab-btn" data-tab="tab-pending">Pending</button>
            </div>
        </div>

        <div id="my-activities-alert" class="form-error hidden" style="margin-bottom: 20px;"></div>

        <!-- Tab Content: Hosting -->
        <div class="tab-content active" id="tab-hosting">
            <div id="hosting-loader" class="loading-state">
                <div class="spinner-large"></div>
            </div>
            <div class="list-layout" id="hosting-list">
                <!-- Dynamic Content -->
            </div>
        </div>

        <!-- Tab Content: Joined -->
        <div class="tab-content" id="tab-joined">
            <div id="joined-loader" class="loading-state">
                <div class="spinner-large"></div>
            </div>
            <div class="list-layout" id="joined-list">
                <!-- Dynamic Content -->
            </div>
        </div>

        <!-- Tab Content: Pending -->
        <div class="tab-content" id="tab-pending">
            <div id="pending-loader" class="loading-state">
                <div class="spinner-large"></div>
            </div>
            <div class="list-layout" id="pending-list">
                <!-- Dynamic Content -->
            </div>
        </div>

    </div>
</main>

<!-- Modals -->
<div id="manage-requests-modal" class="overlay hidden">
    <div class="modal-container glass-panel">
        <button class="close-btn" onclick="document.getElementById('manage-requests-modal').classList.add('hidden')"><i class="ph ph-x"></i></button>
        <div class="auth-header">
            <h2>Manage Requests</h2>
        </div>
        <div id="requests-list" class="list-layout" style="max-height: 400px; overflow-y: auto; padding: 10px;">
            <!-- dynamic -->
        </div>
    </div>
</div>

<div id="participants-modal" class="overlay hidden">
    <div class="modal-container glass-panel">
        <button class="close-btn" onclick="document.getElementById('participants-modal').classList.add('hidden')"><i class="ph ph-x"></i></button>
        <div class="auth-header">
            <h2>Approved Participants</h2>
        </div>
        <div id="participants-list" class="list-layout" style="max-height: 400px; overflow-y: auto; padding: 10px;">
            <!-- dynamic -->
        </div>
    </div>
</div>

<div id="organizer-modal" class="overlay hidden">
    <div class="modal-container glass-panel">
        <button class="close-btn" onclick="document.getElementById('organizer-modal').classList.add('hidden')"><i class="ph ph-x"></i></button>
        <div class="auth-header">
            <h2>Organizer Contact</h2>
        </div>
        <div id="organizer-info" style="padding: 20px; font-size: 1.1rem; line-height: 1.6;">
            <!-- dynamic -->
        </div>
    </div>
</div>

<!-- Scripts -->
<script type="module" src="../assets/js/my-activities.js"></script>
</body>
</html>
